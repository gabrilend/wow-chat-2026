<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PROJECT_NAME}} - Source Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
        }

        #sidebar {
            width: 300px;
            background: #2d2d2d;
            color: #d4d4d4;
            overflow-y: auto;
            border-right: 1px solid #1e1e1e;
            flex-shrink: 0;
        }

        #content {
            flex: 1;
            background: #ffffff;
            overflow-y: auto;
            padding: 2em;
        }

        .tree-header {
            padding: 1em;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        .tree-header h1 {
            font-size: 1.2em;
            font-weight: normal;
            color: #fff;
        }

        .tree {
            padding: 0.5em 0;
        }

        .tree-node {
            padding: 0.3em 0.5em 0.3em 1em;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            transition: background 0.1s;
        }

        .tree-node:hover {
            background: #37373d;
        }

        .tree-node.active {
            background: #094771;
        }

        .tree-node.directory {
            font-weight: bold;
        }

        .tree-node .icon {
            margin-right: 0.5em;
            width: 1em;
            display: inline-block;
            text-align: center;
        }

        .tree-children {
            margin-left: 1em;
        }

        .tree-children.collapsed {
            display: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        #content h1 {
            font-size: 2em;
            margin-bottom: 0.5em;
            color: #333;
        }

        #content h2 {
            font-size: 1.5em;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: #555;
        }

        #content p {
            line-height: 1.6;
            color: #666;
            margin-bottom: 1em;
        }

        .stats {
            background: #f9f9f9;
            padding: 1em;
            border-left: 4px solid #0366d6;
            margin: 1em 0;
        }

        .stats h3 {
            margin-bottom: 0.5em;
            color: #333;
        }

        .stats ul {
            list-style: none;
            padding-left: 1em;
        }

        .stats li {
            padding: 0.25em 0;
            color: #666;
        }

        {{CUSTOM_CSS}}
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="tree-header">
            <h1>{{PROJECT_NAME}}</h1>
        </div>
        <div class="tree">
            {{TREE_CONTENT}}
        </div>
    </div>

    <div id="content">
        <h1>{{PROJECT_NAME}}</h1>
        <p>{{PROJECT_DESCRIPTION}}</p>

        <h2>Project Statistics</h2>
        <div class="stats">
            <h3>Source Tree</h3>
            <ul>
                {{STATS_CONTENT}}
            </ul>
        </div>

        <h2>Navigation</h2>
        <p>Use the sidebar to browse source files, issues, and documentation.</p>
        <p>Click any file to view its contents with syntax highlighting.</p>
    </div>

    <script>
        // Tree navigation
        document.querySelectorAll('.tree-node.directory').forEach(node => {
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                const children = node.nextElementSibling;
                if (children && children.classList.contains('tree-children')) {
                    children.classList.toggle('collapsed');
                    const icon = node.querySelector('.icon');
                    if (icon) {
                        icon.textContent = children.classList.contains('collapsed') ? '▶' : '▼';
                    }
                }
            });
        });

        // Highlight active file
        document.querySelectorAll('.tree-node a').forEach(link => {
            link.addEventListener('click', (e) => {
                document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
                link.parentElement.classList.add('active');
            });
        });
    </script>
</body>
</html>
