<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{FILE_NAME}} - {{PROJECT_NAME}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 2em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            padding: 1.5em 2em;
            background: #2d2d2d;
            color: #fff;
            border-bottom: 3px solid #0366d6;
        }

        header h1 {
            font-size: 1.5em;
            font-weight: normal;
            margin-bottom: 0.5em;
        }

        header .breadcrumb {
            font-size: 0.9em;
            color: #aaa;
        }

        header .breadcrumb a {
            color: #0366d6;
            text-decoration: none;
        }

        header .breadcrumb a:hover {
            text-decoration: underline;
        }

        .meta {
            padding: 1em 2em;
            background: #f9f9f9;
            border-bottom: 1px solid #e1e4e8;
            font-size: 0.9em;
            color: #666;
        }

        .content {
            padding: 2em;
        }

        nav {
            padding: 1em 2em;
            background: #f9f9f9;
            border-top: 1px solid #e1e4e8;
        }

        nav a {
            color: #0366d6;
            text-decoration: none;
            margin-right: 1em;
        }

        nav a:hover {
            text-decoration: underline;
        }

        {{CUSTOM_CSS}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{FILE_NAME}}</h1>
            <div class="breadcrumb">
                <a href="index.html">{{PROJECT_NAME}}</a> / {{FILE_PATH}}
            </div>
        </header>

        <div class="meta">
            <strong>Type:</strong> {{FILE_TYPE}} &nbsp;&nbsp;
            <strong>Size:</strong> {{FILE_SIZE}} bytes &nbsp;&nbsp;
            <strong>Modified:</strong> {{FILE_MTIME}}
        </div>

        <div class="content">
            {{FILE_CONTENT}}
        </div>

        <nav>
            <a href="index.html">← Back to Index</a>
            {{RELATED_LINKS}}
        </nav>
    </div>
</body>
</html>
