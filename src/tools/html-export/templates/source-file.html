<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{FILE_NAME}} - {{PROJECT_NAME}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
        }

        #sidebar {
            width: 300px;
            background: #2d2d2d;
            color: #d4d4d4;
            overflow-y: auto;
            border-right: 1px solid #1e1e1e;
            flex-shrink: 0;
        }

        .tree-header {
            padding: 1em;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        .tree-header h1 {
            font-size: 1.2em;
            font-weight: normal;
            color: #fff;
        }

        .tree {
            padding: 0.5em 0;
        }

        .tree-node {
            padding: 0.3em 0.5em 0.3em 1em;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            transition: background 0.1s;
        }

        .tree-node:hover {
            background: #37373d;
        }

        .tree-node.active {
            background: #094771;
        }

        .tree-node.directory {
            font-weight: bold;
        }

        .tree-node .icon {
            margin-right: 0.5em;
            width: 1em;
            display: inline-block;
            text-align: center;
        }

        .tree-children {
            margin-left: 1em;
        }

        .tree-children.collapsed {
            display: none;
        }

        #main-content {
            flex: 1;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 2em auto;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            padding: 1.5em 2em;
            background: #2d2d2d;
            color: #fff;
            border-bottom: 3px solid #0366d6;
        }

        header h1 {
            font-size: 1.5em;
            font-weight: normal;
            margin-bottom: 0.5em;
        }

        header .breadcrumb {
            font-size: 0.9em;
            color: #aaa;
        }

        header .breadcrumb a {
            color: #0366d6;
            text-decoration: none;
        }

        header .breadcrumb a:hover {
            text-decoration: underline;
        }

        .meta {
            padding: 1em 2em;
            background: #f9f9f9;
            border-bottom: 1px solid #e1e4e8;
            font-size: 0.9em;
            color: #666;
        }

        .content {
            padding: 2em;
        }

        nav {
            padding: 1em 2em;
            background: #f9f9f9;
            border-top: 1px solid #e1e4e8;
        }

        nav a {
            color: #0366d6;
            text-decoration: none;
            margin-right: 1em;
        }

        nav a:hover {
            text-decoration: underline;
        }

        {{CUSTOM_CSS}}
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="tree-header">
            <h1><a href="{{TREE_ROOT_LINK}}" style="color: inherit; text-decoration: none;">{{PROJECT_NAME}}</a></h1>
        </div>
        <div class="tree">
            {{TREE_CONTENT}}
        </div>
    </div>

    <div id="main-content">
        <div class="container">
        <header>
            <h1>{{FILE_NAME}}</h1>
            <div class="breadcrumb">
                <a href="index.html">{{PROJECT_NAME}}</a> / {{FILE_PATH}}
            </div>
        </header>

        <div class="meta">
            <strong>Type:</strong> {{FILE_TYPE}} &nbsp;&nbsp;
            <strong>Size:</strong> {{FILE_SIZE}} bytes &nbsp;&nbsp;
            <strong>Modified:</strong> {{FILE_MTIME}}
        </div>

        <div class="content">
            {{FILE_CONTENT}}
        </div>

        <nav>
            <a href="{{TREE_ROOT_LINK}}">← Back to Index</a>
            {{RELATED_LINKS}}
        </nav>
        </div>
    </div>

    <script>
        // Tree navigation
        document.querySelectorAll('.tree-node.directory').forEach(node => {
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                const children = node.nextElementSibling;
                if (children && children.classList.contains('tree-children')) {
                    children.classList.toggle('collapsed');
                    const icon = node.querySelector('.icon');
                    if (icon) {
                        icon.textContent = children.classList.contains('collapsed') ? '▶' : '▼';
                    }
                }
            });
        });
    </script>
</body>
</html>
