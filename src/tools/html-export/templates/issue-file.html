<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue {{ISSUE_ID}} - {{PROJECT_NAME}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 2em;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            padding: 1.5em 2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        header .issue-id {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 0.5em;
        }

        header h1 {
            font-size: 1.8em;
            font-weight: 600;
        }

        header .status {
            margin-top: 1em;
            padding: 0.5em 1em;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            display: inline-block;
            font-size: 0.9em;
        }

        header .status.completed {
            background: rgba(40, 167, 69, 0.3);
        }

        .content {
            padding: 2em;
            line-height: 1.6;
            color: #333;
        }

        .content h2 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: #667eea;
        }

        .content h3 {
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #764ba2;
        }

        .content p {
            margin-bottom: 1em;
        }

        .content ul, .content ol {
            margin-left: 2em;
            margin-bottom: 1em;
        }

        .content li {
            margin-bottom: 0.5em;
        }

        nav {
            padding: 1em 2em;
            background: #f9f9f9;
            border-top: 1px solid #e1e4e8;
        }

        nav a {
            color: #0366d6;
            text-decoration: none;
            margin-right: 1em;
        }

        nav a:hover {
            text-decoration: underline;
        }

        {{CUSTOM_CSS}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="issue-id">Issue {{ISSUE_ID}} • Phase {{ISSUE_PHASE}}</div>
            <h1>{{ISSUE_TITLE}}</h1>
            <div class="status {{STATUS_CLASS}}">{{STATUS_TEXT}}</div>
        </header>

        <div class="content">
            {{ISSUE_CONTENT}}
        </div>

        <nav>
            <a href="index.html">← Back to Index</a>
            <a href="../phase-{{ISSUE_PHASE}}-progress.html">View Phase {{ISSUE_PHASE}} Progress</a>
        </nav>
    </div>
</body>
</html>
