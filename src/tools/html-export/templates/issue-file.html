<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue {{ISSUE_ID}} - {{PROJECT_NAME}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
        }

        #sidebar {
            width: 300px;
            background: #2d2d2d;
            color: #d4d4d4;
            overflow-y: auto;
            border-right: 1px solid #1e1e1e;
            flex-shrink: 0;
        }

        .tree-header {
            padding: 1em;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        .tree-header h1 {
            font-size: 1.2em;
            font-weight: normal;
            color: #fff;
        }

        .tree {
            padding: 0.5em 0;
        }

        .tree-node {
            padding: 0.3em 0.5em 0.3em 1em;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            transition: background 0.1s;
        }

        .tree-node:hover {
            background: #37373d;
        }

        .tree-node.active {
            background: #094771;
        }

        .tree-node.directory {
            font-weight: bold;
        }

        .tree-node .icon {
            margin-right: 0.5em;
            width: 1em;
            display: inline-block;
            text-align: center;
        }

        .tree-children {
            margin-left: 1em;
        }

        .tree-children.collapsed {
            display: none;
        }

        #main-content {
            flex: 1;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: 2em auto;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            padding: 1.5em 2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        header .issue-id {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 0.5em;
        }

        header h1 {
            font-size: 1.8em;
            font-weight: 600;
        }

        header .status {
            margin-top: 1em;
            padding: 0.5em 1em;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            display: inline-block;
            font-size: 0.9em;
        }

        header .status.completed {
            background: rgba(40, 167, 69, 0.3);
        }

        .content {
            padding: 2em;
            line-height: 1.6;
            color: #333;
        }

        .content h2 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: #667eea;
        }

        .content h3 {
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #764ba2;
        }

        .content p {
            margin-bottom: 1em;
        }

        .content ul, .content ol {
            margin-left: 2em;
            margin-bottom: 1em;
        }

        .content li {
            margin-bottom: 0.5em;
        }

        nav {
            padding: 1em 2em;
            background: #f9f9f9;
            border-top: 1px solid #e1e4e8;
        }

        nav a {
            color: #0366d6;
            text-decoration: none;
            margin-right: 1em;
        }

        nav a:hover {
            text-decoration: underline;
        }

        {{CUSTOM_CSS}}
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="tree-header">
            <h1><a href="{{TREE_ROOT_LINK}}" style="color: inherit; text-decoration: none;">{{PROJECT_NAME}}</a></h1>
        </div>
        <div class="tree">
            {{TREE_CONTENT}}
        </div>
    </div>

    <div id="main-content">
        <div class="container">
        <header>
            <div class="issue-id">Issue {{ISSUE_ID}} • Phase {{ISSUE_PHASE}}</div>
            <h1>{{ISSUE_TITLE}}</h1>
            <div class="status {{STATUS_CLASS}}">{{STATUS_TEXT}}</div>
        </header>

        <div class="content">
            {{ISSUE_CONTENT}}
        </div>

        <nav>
            <a href="{{TREE_ROOT_LINK}}">← Back to Index</a>
        </nav>
        </div>
    </div>

    <script>
        // Tree navigation
        document.querySelectorAll('.tree-node.directory').forEach(node => {
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                const children = node.nextElementSibling;
                if (children && children.classList.contains('tree-children')) {
                    children.classList.toggle('collapsed');
                    const icon = node.querySelector('.icon');
                    if (icon) {
                        icon.textContent = children.classList.contains('collapsed') ? '▶' : '▼';
                    }
                }
            });
        });
    </script>
</body>
</html>
