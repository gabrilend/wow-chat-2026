# config/bot-governor.conf - Knobs for the bot population governor
# Sourced by scripts/bot-governor (issue 151). Plain bash assignments.
# The governor validates every value at startup and refuses to run on
# anything unrecognized — edit boldly, it will tell you if it disagrees.

# ============================================================================
# Thresholds — percent of whole-machine capacity
# ============================================================================
# hot:  at or above this, the governor sheds bots (escalating each cycle)
# cool: only when EVERY selected meter sits below this for a sustained
#       streak does the governor grow the fleet back
# The gap between them is the hysteresis band where it simply holds still —
# keep a real gap or the governor will oscillate.

GOVERNOR_HOT_PERCENT=50
GOVERNOR_COOL_PERCENT=35

# ============================================================================
# Meters — checkboxes: space-separated, any non-empty subset
# ============================================================================
#   [x] cpu     whole-machine CPU busy % (measured across the poll window)
#   [x] memory  MemTotal minus MemAvailable, as % of MemTotal
#   [ ] load    1-minute load average / core count, as %
#
# hot when ANY selected meter >= hot; cool when ALL are < cool.

GOVERNOR_METERS="cpu memory"

# ============================================================================
# Cadence and fleet band
# ============================================================================
# Poll seconds doubles as the CPU sampling window. 20s matches the module's
# own update interval (RandomBotUpdateInterval) — decisions land at the
# same rhythm the module acts on them.
#
# Floor/ceiling bound what the governor may pin the live band to. The
# ceiling deliberately exceeds C020's static 256: the governor can retreat
# when the machine objects, so it is allowed to reach higher when it's
# quiet. Ceilings above ~590 exceed the account pool C018 provisions
# (110 accounts x 10 characters, minus the module's class-pool reserve)
# and are rejected at validation.

GOVERNOR_POLL_SECONDS=20
GOVERNOR_FLEET_FLOOR=128
GOVERNOR_FLEET_CEILING=512

# ============================================================================
# Shed escalation and regrowth
# ============================================================================
# First hot cycle sheds SHED_STEP bots; each consecutive hot cycle doubles
# the count (8, 16, 32, ...) capped at SHED_MAX. Any non-hot cycle resets
# the escalation.
# After COOL_STREAK consecutive cool cycles, the fleet target rises by
# GROW_STEP (and the streak resets), climbing toward the ceiling.

GOVERNOR_SHED_STEP=8
GOVERNOR_SHED_MAX=64
GOVERNOR_GROW_STEP=16
GOVERNOR_COOL_STREAK=3

# ============================================================================
# Logout method — radio buttons: exactly one, write its name below
# ============================================================================
#   (o) idle-first    kick outwardly-idle bots first: ungrouped, on
#                     continent maps, in zones with no real players;
#                     ties broken randomly. (The module's true idle flag
#                     lives in process memory — this is the honest
#                     database approximation of it.)
#   ( ) random        kick any online random bot, uniformly
#   ( ) newest-first  kick the most recently logged-in bots first —
#                     the least-settled leave before world fixtures
#   ( ) drain         never kick; squeeze the band and let bots age out
#                     on their own in-world timers (hours to days slow,
#                     the gentlest and slowest option)

GOVERNOR_LOGOUT_METHOD="idle-first"

# ============================================================================
# Method options — checkboxes: space-separated, any number, order-free
# ============================================================================
#   [x] spare-grouped          never kick a bot grouped with a real player
#   [x] spare-dungeoneers      never kick a bot inside a dungeon or raid
#   [ ] spare-nearby           never kick a bot sharing a zone with a
#                              real player
#   [ ] persist-shrunken-band  on governor shutdown, leave the last pinned
#                              band in playerbots.conf (default: restore
#                              the floor/ceiling band above and hand
#                              control back to the module)
#   [ ] announce               broadcast a server announcement whenever
#                              the governor sheds or grows
#
# Applicability: the spare-* options steer the three kick methods and are
# rejected when the method is `drain` (it never targets individuals).
# persist-shrunken-band and announce apply to every method.

GOVERNOR_LOGOUT_OPTIONS="spare-grouped spare-dungeoneers"
