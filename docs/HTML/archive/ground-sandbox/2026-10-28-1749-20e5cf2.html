  if (best !== active) {
    active = best;
    $("where").textContent = C.data.zones[zoneIdx].name + (best >= 0 ? " — " + fences[best].name + " (" + fences[best].spawns + " spawns)" : " — outside every fence: the bots follow");
  }
}
// }}}

// {{{ the measures, over the last minute
const cover = { cells: new Map(), size: 5 };
let simT = 0;
function measure() {
  const f = fences[active];
  const lines = [];
  // turning: each bot's angle round the fence's middle, 30 s ago to now
  let cw = 0, ccw = 0, circ = 0;
  for (const b of bots) {
    if (f) b.ang.push([simT, Math.atan2(b.y - f.cy, b.x - f.cx)]);
    while (b.ang.length && simT - b.ang[0][0] > 30) b.ang.shift();
    let net = 0;
    for (let i = 1; i < b.ang.length; i++) { let d = b.ang[i][1] - b.ang[i - 1][1]; d = (d + Math.PI) % (2 * Math.PI); if (d < 0) d += 2 * Math.PI; net += d - Math.PI; }
    if (Math.abs(net) >= Math.PI) { circ++; if (net > 0) cw++; else ccw++; }
  }
  // covering: the fence's 5-yard cells a bot crossed within the minute
  let covered = 0, total = 0;
  if (f) {
    for (const b of bots) cover.cells.set(Math.floor(b.x / cover.size) + "," + Math.floor(b.y / cover.size), simT);
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const [x, y] of f.poly) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    for (let x = Math.floor(x0 / 5); x <= x1 / 5; x++) for (let y = Math.floor(y0 / 5); y <= y1 / 5; y++) {
      if (!inside(f, x * 5 + 2.5, y * 5 + 2.5)) continue;
      total++;
      const t = cover.cells.get(x + "," + y);
      if (t !== undefined && simT - t <= 60) covered++;
    }
  }
  // spacing: the median distance to the nearest other bot
  const nn = bots.map(b => Math.min(...bots.filter(o => o !== b).map(o => Math.hypot(o.x - b.x, o.y - b.y)))).sort((a, b) => a - b);
  lines.push(`bots            ${bots.length}`);
  lines.push(`circling (30s)  ${circ} of ${bots.length}`);
  lines.push(`  clockwise     ${cw}   anticlockwise ${ccw}`);
  lines.push(`fence covered   ${total ? Math.round(100 * covered / total) : 0}% (last minute)`);
  lines.push(`spacing         ${nn.length ? nn[Math.floor(nn.length / 2)].toFixed(1) : "-"} yd (median nearest)`);
  // the ground: steps turned aside and stopped a second, since the last
  // measure; the fence's open share at the slider's limit
  const secs = Math.max(simT - steer.since, 1e-6);
  if (GROUND) {
    lines.push(`turned aside    ${(steer.turned / secs).toFixed(1)} steps a second`);
    lines.push(`stopped         ${(steer.stopped / secs).toFixed(1)} steps a second`);
    lines.push(`fence open      ${f ? Math.round(100 * openShareOf(f)) + "%" : "-"} (not steep, no doodad)`);
    lines.push(`zone doodads    ${GROUND.rects.length / 4}`);
    lines.push(`zone level      ${GROUND.level !== undefined ? GROUND.level.toFixed(1) + " yd (walkable ground's average)" : "-"}`);
  } else lines.push(`ground          ${zoneIdx >= 0 ? "none for this zone (generate-ground-sandbox-data)" : "-"}`);
  // wanderers (617e16d): since the page began, crossings, the turns aside
  // by the ground (down or up from where they stood), orbit reversals
  if (+$("turn").value === 2) {
    const inState = s => bots.filter(b => b.wstate === s).length;
    lines.push(`crossings       ${wander.crossings}   now crossing ${inState("cross")}`);
    lines.push(`turned aside    ${wander.down} down, ${wander.up} up`);
    lines.push(`orbit reversed  ${wander.reversals}`);
  }
  // a formation (617e16e): how far, on average, members stand from their places
  if ($("form").value !== "none" && patrol.n) {
    let off = 0;
    for (let i = 0; i < patrol.n; i++) { const [px, py] = placeOf(i); off += Math.hypot(bots[i].x - px, bots[i].y - py); }
    lines.push(`formation       ${patrol.shape}, ${patrol.n} bots, ${(off / patrol.n).toFixed(1)} yd from places`);
  }
  steer.turned = 0; steer.stopped = 0; steer.since = simT;
  $("measures").textContent = lines.join("\n");
}
// }}}

// {{{ live players: the world server's stream (issue 617e16a)
// Asked once a second at http://127.0.0.1:<port>/positions (the server's
// Buddies.MapStream.Port, 8097 unless set; #port= in the address moves it).
// Each character keeps a short tail of where it was. Each answer, and what
// it shows: characters (drawn on their continent), or none / no answer
// ("not streaming": the server is down, built without the stream, or on
// another port).
const live = { on: false, chars: new Map(), port: 8097, timer: null, said: "off" };
async function pollLive() {
  try {
    const r = await fetch(`http://127.0.0.1:${live.port}/positions`, { cache: "no-store" });
    const j = await r.json(), now = performance.now() / 1000, seen = new Set();
    for (const c of j.characters) {
      seen.add(c.g);
      const e = live.chars.get(c.g) || { tail: [] };
      Object.assign(e, c);
      e.tail.push([now, c.x, c.y]);
      while (e.tail.length && now - e.tail[0][0] > 60) e.tail.shift();
      live.chars.set(c.g, e);
    }
    for (const g of [...live.chars.keys()]) if (!seen.has(g)) live.chars.delete(g);
    live.said = j.characters.length + " in the world";
  } catch (err) { live.said = "not streaming"; live.chars.clear(); }
  $("liveN").textContent = live.said;
}
function drawLive(T) {
  if (!live.on) return;
  const now = performance.now() / 1000, r = Math.max(2.5, cam.z / SQ * 1.5);
  for (const c of live.chars.values()) {
    if (c.m !== C.data.map) continue;
    const colour = c.k === "buddy" ? ownerColour(c.o) : (c.k === "bot" ? "#b8b8b8" : T.player);
    ctx.fillStyle = colour;
    for (const [t, x, y] of c.tail) {
      const [sx, sy] = toScreen(x, y), [cc, rr] = pixOf(sx, sy), [px, py] = toCanvas(cc, rr);
      ctx.globalAlpha = Math.max(0, 1 - (now - t) / 60) * 0.5; ctx.fillRect(px - 1, py - 1, 2, 2);
    }
    ctx.globalAlpha = c.d ? 0.4 : 1;
    const [sx, sy] = toScreen(c.x, c.y), [cc, rr] = pixOf(sx, sy), [px, py] = toCanvas(cc, rr);
    ctx.beginPath(); ctx.arc(px, py, c.k === "player" ? r * 1.4 : r, 0, 6.283); ctx.fill();
    if (c.k === "player" && cam.z > 2) { ctx.globalAlpha = 1; ctx.font = "12px system-ui"; ctx.fillText(c.n, px + r * 2, py - r * 2); }
  }
  ctx.globalAlpha = 1;
}
function ownerColour(o) {                                  // a hue from the owner's number (as scripts/render-zone)
  const h = (o * 0.6180339887) % 1;
  return `hsl(${Math.round(h * 360)}, 85%, 60%)`;
}
// }}}

// {{{ drawing
function draw() {
  const T = THEMES[$("theme").value], w = cv.width, h = cv.height;
  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingEnabled = false;
  const [x0, y0] = toCanvas(0, 0);
  ctx.drawImage(C.canvas, x0, y0, C.W * cam.z, C.H * cam.z);
  if (zoneIdx < 0) { drawLive(T); return; }
  const yd2px = (sx, sy) => { const [c, r] = pixOf(sx, sy); return toCanvas(c, r); };
  // the ground: the shaded picture over the zone (a point's pixel centred
  // on it), and, once a yard is over a pixel, each doodad's footprint
  if (GROUND && +$("shade").value > 0) {
    const g = GROUND, [ax, ay] = yd2px(g.sx0 - g.step / 2, g.sy0 - g.step / 2), [bx, by] = yd2px(g.sx0 + (g.cols - 0.5) * g.step, g.sy0 + (g.rows - 0.5) * g.step);
    // through a transform, not a stretch: the picture's columns run with
    // sx, the screen's may run against it (pixOf), and a negative scale
    // mirrors it the right way where a stretch would not
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.translate(ax, ay); ctx.scale((bx - ax) / g.cols, (by - ay) / g.rows);
    ctx.drawImage(g.canvas, 0, 0);
    ctx.restore();
    ctx.imageSmoothingEnabled = false;
    if (+$("shade").value === 2 && cam.z / SQ > 1) {
      ctx.fillStyle = T.doodad || "rgba(0,0,0,0.55)";
      const [vx0, vy0] = yardsOf(...fromCanvas(0, 0)), [vx1, vy1] = yardsOf(...fromCanvas(cv.width, cv.height));
      const lox = Math.min(vx0, vx1), hix = Math.max(vx0, vx1), loy = Math.min(vy0, vy1), hiy = Math.max(vy0, vy1);
      for (let i = 0; i < g.rects.length; i += 4) {
        if (g.rects[i + 2] < lox || g.rects[i] > hix || g.rects[i + 3] < loy || g.rects[i + 1] > hiy) continue;
        const [p0, q0] = yd2px(g.rects[i] + BODY_R, g.rects[i + 1] + BODY_R), [p1, q1] = yd2px(g.rects[i + 2] - BODY_R, g.rects[i + 3] - BODY_R);
        ctx.fillRect(Math.min(p0, p1), Math.min(q0, q1), Math.max(1, Math.abs(p1 - p0)), Math.max(1, Math.abs(q1 - q0)));
      }
    }
  }
  // fences
  fences.forEach((f, i) => {
    ctx.beginPath();
    f.poly.forEach(([x, y], k) => { const [px, py] = yd2px(x, y); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.closePath();
    if (i === active) { ctx.fillStyle = T.fenceFill; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = T.fenceOn; }
    else { ctx.lineWidth = 1; ctx.strokeStyle = T.fence; }
    ctx.stroke();
  });
  // bots and their tails
  const tailS = +$("tail").value, rpx = Math.max(2, cam.z / SQ * 1.2);
  ctx.shadowColor = T.bot; ctx.shadowBlur = T.glow;
  // formation members (617e16e) in the fence's lit colour, the rest in the bots' own
  const formedN = $("form").value === "none" ? 0 : Math.min(+$("formN").value, bots.length);
  bots.forEach((b, bi) => {
    const colour = bi < formedN ? T.fenceOn : T.bot;
    for (const [t, x, y] of b.tail) {
      const a = 1 - (simT - t) / Math.max(tailS, 1);
      if (a <= 0) continue;
      const [px, py] = yd2px(x, y);
      ctx.globalAlpha = a * 0.5; ctx.fillStyle = colour; ctx.fillRect(px - 1, py - 1, 2, 2);
    }
    ctx.globalAlpha = 1;
    const [px, py] = yd2px(b.x, b.y);
    ctx.beginPath(); ctx.arc(px, py, rpx, 0, 6.283); ctx.fillStyle = colour; ctx.fill();
  });
  ctx.shadowBlur = T.glow; ctx.shadowColor = T.player;
  const [ppx, ppy] = yd2px(player.x, player.y);
  ctx.beginPath(); ctx.arc(ppx, ppy, rpx * 1.6, 0, 6.283); ctx.fillStyle = T.player; ctx.fill();
  ctx.shadowBlur = 0;
  drawLive(T);
}
// }}}

// {{{ the loop
let last = performance.now(), tailClock = 0, measureClock = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000) * +$("speed").value;
  last = now;
  stepCamera(now);
  if (zoneIdx >= 0) {
    for (let k = 0, n = Math.ceil(dt / 0.05), s = dt / n; k < n; k++) { stepPlayer(s); stepFlock(s); simT += s; }
    tailClock += dt; measureClock += dt;
    if (tailClock >= 0.5) {
      tailClock = 0;
      const keep = +$("tail").value;
      for (const b of bots) { b.tail.push([simT, b.x, b.y]); while (b.tail.length && simT - b.tail[0][0] > keep) b.tail.shift(); }
    }
    if (measureClock >= 1) { measureClock = 0; measure(); }
  }
  draw();
  requestAnimationFrame(frame);
}
// }}}

// {{{ input: clicks, the wheel, the panel
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", () => { resize(); if (!glide) Object.assign(cam, zoneIdx >= 0 ? zoneFit(zoneIdx) : worldFit()); });
cv.addEventListener("click", e => {
  const [col, row] = fromCanvas(e.clientX, e.clientY);
  const zi = (col >= 0 && row >= 0 && col < C.W && row < C.H) ? C.zoneAt[Math.floor(row) * C.W + Math.floor(col)] : -1;
  if (zoneIdx < 0) { if (zi >= 0) enterZone(zi); return; }
  // the player is there at once (the owner, 2026-10-28: "the player click dot should move instantly")
  if (zi === zoneIdx) { const [x, y] = yardsOf(col, row); player.x = player.tx = x; player.y = player.ty = y; }
  else if (zi >= 0) enterZone(zi);
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  glide = null;
  const [col, row] = fromCanvas(e.clientX, e.clientY);
  const k = Math.exp(-e.deltaY * 0.0015);
  cam.z *= k;
  cam.cx = col - (e.clientX - cv.width / 2) / cam.z; cam.cy = row - (e.clientY - cv.height / 2) / cam.z;
  const wf = worldFit();
  if (zoneIdx >= 0 && cam.z < zoneFit(zoneIdx).z * 0.45) { zoneIdx = -1; fences = []; bots = []; active = -1; $("where").textContent = C.data.name; glideTo(wf, 900); }
  else if (zoneIdx < 0 && cam.z > wf.z * 4) {
    const zi = C.zoneAt[Math.floor(row) * C.W + Math.floor(col)];
    if (zi >= 0) enterZone(zi);
  }
}, { passive: false });
$("close").onclick = () => { if (fences[active]) glideTo(fenceFit(fences[active]), 900); else if (zoneIdx >= 0) glideTo(zoneFit(zoneIdx), 900); };
$("world").onclick = () => { zoneIdx = -1; fences = []; bots = []; active = -1; $("where").textContent = C.data.name; glideTo(worldFit()); };
$("scatter").onclick = () => { if (zoneIdx < 0) return; const z = C.data.zones[zoneIdx]; for (const b of bots) {
  const c = z.Y0 - C.Y0 + Math.random() * (z.Y1 - z.Y0 + 1), r = z.X0 - C.X0 + Math.random() * (z.X1 - z.X0); [b.x, b.y] = yardsOf(c, r); b.vx = b.vy = 0; } };
$("bots").oninput = () => { $("botsN").textContent = $("bots").value; if (zoneIdx >= 0) spawnBots(+$("bots").value, player.x, player.y, 25); };
$("live").onchange = () => {
  live.on = $("live").checked;
  clearInterval(live.timer);
  if (live.on) { pollLive(); live.timer = setInterval(pollLive, 1000); } else { live.chars.clear(); $("liveN").textContent = "off"; }
};
$("tail").oninput = () => { $("tailN").textContent = $("tail").value + " s"; };
$("slope").oninput = () => { $("slopeN").textContent = $("slope").value + "°"; paintGround(); };
$("formN").oninput = () => { $("formNN").textContent = $("formN").value; };
$("formTurn").onchange = () => { $("formTurnN").textContent = $("formTurn").checked ? "turning" : "rigid"; };
$("shade").onchange = () => paintGround();
$("theme").onchange = () => { buildContinent(+$("continent").value, $("theme").value); };
$("continent").onchange = () => { zoneIdx = -1; fences = []; bots = []; buildContinent(+$("continent").value, $("theme").value); glideTo(worldFit(), 600); $("where").textContent = C.data.name; };
// a strip: 8 frames, half a second of play apart, side by side in two rows, saved as a PNG
$("strip").onclick = async () => {
  const frames = [];
  for (let i = 0; i < 8; i++) { frames.push(await createImageBitmap(cv)); await new Promise(r => setTimeout(r, 500)); }
  const s = document.createElement("canvas"), fw = Math.floor(cv.width / 2), fh = Math.floor(cv.height / 2);
  s.width = fw * 4; s.height = fh * 2;
  const sc = s.getContext("2d");
  frames.forEach((f, i) => sc.drawImage(f, (i % 4) * fw, Math.floor(i / 4) * fh, fw, fh));
  const a = document.createElement("a"); a.href = s.toDataURL("image/png"); a.download = "ground-strip-" + Date.now() + ".png"; a.click();
};
// }}}

// {{{ start
SANDBOX.continents.forEach((c, i) => $("continent").add(new Option(c.name, i)));
Object.keys(THEMES).forEach(t => $("theme").add(new Option(t, t)));
resize();
// Driven from the address, so a run needs no person (a headless browser's
// screenshot, the judge's frames): #continent=1&zone=The%20Barrens&theme=ninja&sim=120&turn=1&bots=36&fence=2&view=fence
//   continent  its index (0 Eastern Kingdoms, 1 Kalimdor); zone: its name;
//   theme; turn (1 clockwise, -1 anticlockwise, 0 each its own); bots;
//   fence: put the player in that fence (by its rank, 0 the largest);
//   sim: seconds of play run at once before the first picture;
//   view=fence: the close-up of the fence in play (the judge's frames);
//   live=1: the world server's stream on; port: its port (8097)
//   slope: the steepest walkable ground, degrees (50); shade: 2 hills and
//     blocks, 1 hills, 0 flat (issue 617e16c)
const Q = new URLSearchParams(location.hash.slice(1));
if (Q.has("slope")) { $("slope").value = Q.get("slope"); $("slopeN").textContent = Q.get("slope") + "°"; }
if (Q.has("shade")) $("shade").value = Q.get("shade");
//   form: a formation (line, column, wedge, ring, square); formN: how many
//     bots form it; formTurn=0: rigid (617e16e); turn=2: wanderers (617e16d)
if (Q.has("form")) $("form").value = Q.get("form");
if (Q.has("formN")) { $("formN").value = Q.get("formN"); $("formNN").textContent = Q.get("formN"); }
if (Q.get("formTurn") === "0") { $("formTurn").checked = false; $("formTurnN").textContent = "rigid"; }
if (Q.has("theme") && THEMES[Q.get("theme")]) $("theme").value = Q.get("theme");
if (Q.has("port")) live.port = +Q.get("port");
if (Q.get("live") === "1") { $("live").checked = true; $("live").onchange(); }
if (Q.has("turn")) $("turn").value = Q.get("turn");
if (Q.has("bots")) { $("bots").value = Q.get("bots"); $("botsN").textContent = Q.get("bots"); }
const startContinent = Q.has("continent") ? +Q.get("continent") : 0;
$("continent").value = startContinent;
buildContinent(startContinent, $("theme").value);
Object.assign(cam, worldFit());
$("where").textContent = C.data.name;
if (Q.has("zone")) {
  const zi = C.data.zones.findIndex(z => z.name === Q.get("zone"));
  if (zi >= 0) {
    enterZone(zi);
    if (Q.has("fence") && fences[+Q.get("fence")]) { const f = fences[+Q.get("fence")]; player.x = player.tx = f.cx; player.y = player.ty = f.cy; spawnBots(bots.length, f.cx, f.cy, 25); }
    glide = null; Object.assign(cam, zoneFit(zi));
    stepPlayer(0);                                         // the fence in play, before the close-up asks for it
    const run = +(Q.get("sim") || 0);
    for (let t = 0; t < run; t += 0.05) {
      stepPlayer(0.05); stepFlock(0.05); simT += 0.05;
      if (Math.round(simT * 20) % 10 === 0) { const keep = +$("tail").value; for (const b of bots) { b.tail.push([simT, b.x, b.y]); while (b.tail.length && simT - b.tail[0][0] > keep) b.tail.shift(); } }
      if (Math.round(simT * 20) % 20 === 0) measure();
    }
    if (Q.get("view") === "fence" && fences[active]) Object.assign(cam, fenceFit(fences[active]));
  }
}
draw();                                      // once now: a screenshot may come before the first frame
requestAnimationFrame(frame);
// }}}
</script>
</body>
</html>
