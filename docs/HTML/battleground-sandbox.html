    const counts = new Uint16Array(16), offs = new Uint16Array(16), syms = new Uint16Array(n);

      if (b.owner !== u.side && b.assaulter !== u.side) { const p = u.guard; u.guard = null; makeSquad(u.side, [u], p); continue; }
      const a = (u.id * 1.7 + simT * 0.05) % 6.283;
      stepToward(u, b.x + Math.cos(a) * 4, b.y + Math.sin(a) * 4, dt, 0.4);
    }
  }
  // squads: walk the road while none of them fights ("no enemies to fight
  // means you won the battle, so go and claim your prize"); assault at a base
  for (const s of squads) {
    if (!s.members.length) continue;
    const fighting = s.members.some(u => u.fighting);
    if (s.job === "assault") {
      const b = bases[s.at];
      for (const u of s.members) if (!u.fighting) stepToward(u, b.x + (u.id % 3 - 1) * 2, b.y + (u.id % 2) * 2, dt);
      if (b.owner === s.side) {                             // taken: one stays to guard, the rest go on
        if (s.members.length > 1) { const g = s.members.pop(); g.squad = null; g.guard = s.at; }
        chooseRoad(s);
      }
      continue;
    }
    if (!fighting) {
      const slowest = Math.min(...s.members.map(u => { const [ax, ay] = anchor(s); return Math.hypot(u.x - ax, u.y - ay) > 10 ? 0.5 : 1; }));
      s.along += SPEED * dt * slowest * 0.95;
    }
    const [ax, ay, hd, end] = anchor(s);
    for (const u of s.members) {
      if (u.fighting) continue;
      if (u.broke) { stepToward(u, ...BG.places[otherEnd(s.road, s.at)].slice(0, 2), dt); continue; }
      const [tx, ty] = spotOf(s, u, ax, ay, hd); stepToward(u, tx, ty, dt);
    }
    if (end && !fighting && s.members.every(u => Math.hypot(u.x - ax, u.y - ay) < 14)) squadAtPlace(s);
  }
  squads = squads.filter(s => s.members.length);
  flagStep(dt);
  // resources, by bases held
  for (let side = 0; side < 2; side++) {
    const n = BASES.filter(b => bases[b].owner === side).length;
    if (!n) { nextTick[side] = simT + 1; continue; }
    if (simT >= nextTick[side]) { res[side] = Math.min(WIN_AT, res[side] + TICK[n][0]); nextTick[side] = simT + TICK[n][1]; }
    if (res[side] >= WIN_AT && over === null) { over = 0; winner = side; }
  }
}
function nearestPlace(u) {
  let best = home[u.side], bd = 1e9;
  for (const p in BG.places) { const [x, y] = BG.places[p], d = Math.hypot(x - u.x, y - u.y); if (d < bd) { bd = d; best = p; } }
  return best;
}
// }}}

// {{{ drawing
// cam: the middle (screen yards) and pixels a yard
const cam = { x: 0, y: 0, s: 1 };
function fitField() {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p in BG.places) { const [x, y] = BG.places[p]; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  cam.x = (x0 + x1) / 2 - 60; cam.y = (y0 + y1) / 2;
  cam.s = Math.min(W / (x1 - x0 + 260), H / (y1 - y0 + 120));
}
const toPx = (x, y) => [(x - cam.x) * cam.s + W / 2, (y - cam.y) * cam.s + H / 2];
const sideColour = s => s < 0 ? "#9aa0a6" : getComputedStyle(document.documentElement).getPropertyValue(s ? "--side1" : "--side0").trim();
function draw() {
  ctx.fillStyle = "#1b2a22"; ctx.fillRect(0, 0, W, H);
  if (G) {
    const [px, py] = toPx(G.sx0, G.sy0);
    ctx.imageSmoothingEnabled = cam.s < 2;
    ctx.drawImage(G.canvas, px - G.step * cam.s / 2, py - G.step * cam.s / 2, G.cols * G.step * cam.s, G.rows * G.step * cam.s);
    // doodads, when close enough to see
    if (cam.s > 0.9) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      for (let i = 0; i < G.rects.length; i += 4) { const [a, b] = toPx(G.rects[i], G.rects[i + 1]); ctx.fillRect(a, b, (G.rects[i + 2] - G.rects[i]) * cam.s, (G.rects[i + 3] - G.rects[i + 1]) * cam.s); }
    }
  }
  // roads
  ctx.strokeStyle = "rgba(232,197,71,0.35)"; ctx.lineWidth = 2;
  for (const r of BG.roads) { ctx.beginPath(); r.pts.forEach(([x, y], i) => { const [a, b] = toPx(x, y); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); ctx.stroke(); }
  // places
  ctx.font = "12px system-ui"; ctx.textAlign = "center";
  for (const p in BG.places) {
    const [x, y] = BG.places[p], [a, b] = toPx(x, y), base = bases && bases[p], r = Math.max(8, FLAG_REACH * cam.s);
    const homeOf = home ? home.indexOf(p) : -1;
    ctx.beginPath(); ctx.arc(a, b, r, 0, 6.283);
    ctx.fillStyle = base ? (base.owner < 0 ? "rgba(154,160,166,0.35)" : sideColour(base.owner) + "88") : sideColour(homeOf) + "55";
    ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#e8e8e8"; ctx.stroke();
    if (base && base.assaulter >= 0) {
      ctx.beginPath(); ctx.arc(a, b, r + 4, -Math.PI / 2, -Math.PI / 2 + 6.283 * (1 - base.left / ASSAULT_TIME));
      ctx.strokeStyle = sideColour(base.assaulter); ctx.lineWidth = 4; ctx.stroke();
    }
    ctx.fillStyle = "#e8e8e8"; ctx.fillText(homeOf >= 0 ? (homeOf ? "Horde home" : "Alliance home") : p, a, b - r - 6);
  }
  // fights: a thin line from each fighter to its foe
  ctx.lineWidth = 1;
  for (const u of units) if (u.alive && u.fighting && u.target && u.target.alive) {
    const [a, b] = toPx(u.x, u.y), [c, d] = toPx(u.target.x, u.target.y);
    ctx.strokeStyle = sideColour(u.side) + "55"; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
  }
  // units: square a tank, cross a healer, dot a damage dealer; a ring a guard; white edge breaking off
  for (const u of units) {
    if (!u.alive) continue;
    const [a, b] = toPx(u.x, u.y), r = Math.max(3, 1.2 * cam.s);
    ctx.fillStyle = sideColour(u.side);
    if (u.role === "tank") ctx.fillRect(a - r, b - r, 2 * r, 2 * r);
    else if (u.role === "healer") { ctx.fillRect(a - r, b - r / 3, 2 * r, 2 * r / 3); ctx.fillRect(a - r / 3, b - r, 2 * r / 3, 2 * r); }
    else { ctx.beginPath(); ctx.arc(a, b, r, 0, 6.283); ctx.fill(); }
    if (u.guard) { ctx.beginPath(); ctx.arc(a, b, r + 3, 0, 6.283); ctx.strokeStyle = sideColour(u.side); ctx.lineWidth = 1.5; ctx.stroke(); }
    if (u.broke) { ctx.beginPath(); ctx.arc(a, b, r + 1.5, 0, 6.283); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke(); }
    // health, when hurt
    const share = u.hp / ROLE[u.role].hp;
    if (share < 0.99) { ctx.fillStyle = "#000a"; ctx.fillRect(a - 6, b + r + 2, 12, 2); ctx.fillStyle = "#7f7"; ctx.fillRect(a - 6, b + r + 2, 12 * share, 2); }
  }
  if (over !== null) {
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, H / 2 - 30, W, 60);
    ctx.fillStyle = sideColour(winner); ctx.font = "bold 26px system-ui"; ctx.textAlign = "center";
    ctx.fillText(`${winner ? "The Horde" : "The Alliance"} wins; the next match in ${Math.ceil(NEXT_MATCH - over)} s`, W / 2, H / 2 + 9);
  }
  measures();
}
function measures() {
  if (!units) return;
  const names = ["Alliance", "Horde"];
  let sc = "";
  for (let s = 0; s < 2; s++) {
    const held = BASES.filter(b => bases[b].owner === s).length;
    sc += `<div style="color:${sideColour(s)}">${names[s]} (${home[s]}): ${res[s]} of ${WIN_AT}, ${held} bases</div>` +
          `<div class="bar"><div style="width:${res[s] / WIN_AT * 100}%;background:${sideColour(s)}"></div></div>`;
  }
  $("score").innerHTML = sc;
  const row = (label, f) => (label + "            ").slice(0, 14) + [0, 1].map(s => String(f(s)).padStart(7)).join("");
  const alive = s => units.filter(u => u.alive && u.side === s);
  $("measures").textContent = [
    "              Alliance  Horde",
    row("in play", s => alive(s).length),
    row("waiting", s => deadWaiting[s].length),
    row("fighting", s => alive(s).filter(u => u.fighting).length),
    row("orbiting", s => alive(s).filter(u => u.orbiting).length),
    row("guarding", s => alive(s).filter(u => u.guard).length),
    row("squads", s => squads.filter(q => q.side === s).length),
    row("kills", s => tally.kills[s]),
    row("bases taken", s => tally.captures[s]),
    row("broke off", s => tally.breaks[s]),
    `match time    ${Math.floor(simT / 60)}:${String(Math.floor(simT % 60)).padStart(2, "0")}`,
  ].join("\n");
}
// }}}

// {{{ the loop, the panel, input
let last = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t;
  const n = +$("speed").value;
  for (let k = 0; k < n; k++) step(dt);
  draw(); requestAnimationFrame(frame);
}
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", () => { resize(); draw(); });
const labels = { side: v => v, notice: v => v + " yd", ranged: v => v + " yd", brk: v => Math.round(v * 100) + "% a second", lean: v => v, slope: v => v + "°" };
for (const id in labels) $(id).oninput = () => { $(id + "N").textContent = labels[id]($(id).value); if (id === "slope") paintGround(); };
$("again").onclick = () => newMatch();
$("fit").onclick = () => fitField();
cv.addEventListener("wheel", e => { e.preventDefault(); const k = e.deltaY < 0 ? 1.2 : 1 / 1.2; const wx = (e.clientX - W / 2) / cam.s + cam.x, wy = (e.clientY - H / 2) / cam.s + cam.y; cam.s *= k; cam.x = wx - (e.clientX - W / 2) / cam.s; cam.y = wy - (e.clientY - H / 2) / cam.s; }, { passive: false });
let drag = null;
cv.addEventListener("mousedown", e => { drag = [e.clientX, e.clientY, cam.x, cam.y]; });
addEventListener("mouseup", () => { drag = null; });
addEventListener("mousemove", e => { if (drag) { cam.x = drag[2] - (e.clientX - drag[0]) / cam.s; cam.y = drag[3] - (e.clientY - drag[1]) / cam.s; } });
// }}}

// {{{ start
// The address settings (as the ground sandbox's): side, notice, ranged,
// brk, lean, slope, speed set the panel; sim: seconds of play run at once
// before the first picture (for headless pictures).
resize();
const Q = new URLSearchParams(location.hash.slice(1));
for (const id of ["side", "notice", "ranged", "brk", "lean", "slope", "speed"]) if (Q.has(id)) { $(id).value = Q.get(id); $(id).oninput && $(id).oninput(); }
G = loadGround();
paintGround();
newMatch(); fitField();
if (!G) $("score").textContent = "Arathi Basin's ground did not load (battleground-sandbox/zone-529-3358.js beside the page).";
const run = +(Q.get("sim") || 0);
for (let t = 0; t < run; t += 0.1) step(0.1);
draw();
requestAnimationFrame(frame);
// }}}
</script>
