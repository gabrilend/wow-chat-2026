  }
  let rows = `<dt>Armor</dt><dd>${armor}</dd>`;
  if (dps) rows += `<dt>Weapon dps</dt><dd>${dps.toFixed(1)}</dd>`;
  for (const [t, v] of Object.entries(st)) rows += `<dt>${STAT[t] || "stat " + t}</dt><dd>+${v}</dd>`;
  const grays = Object.values(items).filter(id => (DATA.items[String(id)] || {}).q === 0).length;
  rows += `<dt>Gray pieces</dt><dd>${grays}</dd>`;
  return rows;
}
function card(c, tier) {
  const key = c.id + "-" + tier;
  const shape = shapeOf[key] || 1;
  const items = c.tiers[String(tier)][shape - 1];
  const opts = c.shapes.map((l, i) => `<option value="${i + 1}"${i + 1 === shape ? " selected" : ""}>${l}</option>`).join("");
  return `<article class="card" data-key="${key}">
    <header><h2>${c.name}<small>level ${tier}</small></h2>
      <select aria-label="Talent shape" data-key="${key}">${opts}</select></header>
    <div class="doll">
      <div class="col">${LEFT.map(s => slotHtml(s, items)).join("")}</div>
      <div class="portrait"><div class="figure">3D figure: waits on the custom client drawing items on a character (617r5)</div>
        <dl>${sums(items)}</dl></div>
      <div class="col">${RIGHT.map(s => slotHtml(s, items)).join("")}</div>
    </div>
    <div class="weapons">${HANDS.map(s => slotHtml(s, items)).join("")}</div>
  </article>`;
}
function render() {
  const out = [];
  for (const c of DATA.classes) {
    if (pickClass && c.id !== pickClass) continue;
    for (const t of DATA.tiers) if (!pickTier || t === pickTier) out.push(card(c, t));
  }
  document.getElementById("grid").innerHTML = out.join("");
}
// }}}

// {{{ controls
function chips(boxId, list, label, get, set) {
  const box = document.getElementById(boxId);
  const all = [{ v: 0, l: "All" }, ...list.map(x => ({ v: x.v, l: label(x) }))];
  for (const a of all) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = a.l; b.setAttribute("aria-pressed", String(get() === a.v));
    b.addEventListener("click", () => { set(a.v); box.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); });
    box.appendChild(b);
  }
}
chips("classes", DATA.classes.map(c => ({ v: c.id, n: c.name })), x => x.n, () => pickClass, v => { pickClass = v; });
chips("tiers", DATA.tiers.map(t => ({ v: t })), x => String(x.v), () => pickTier, v => { pickTier = v; });
document.getElementById("grid").addEventListener("change", e => {
  if (e.target.matches("select")) { shapeOf[e.target.dataset.key] = Number(e.target.value); render(); }
});
const grid = document.getElementById("grid");
grid.addEventListener("mouseover", e => { const s = e.target.closest(".slot[data-item]"); if (s) showTip(s, e); });
grid.addEventListener("mousemove", e => { const s = e.target.closest(".slot[data-item]"); if (s) showTip(s, e); });
grid.addEventListener("mouseout", e => { if (e.target.closest(".slot[data-item]")) hideTip(); });
grid.addEventListener("focusin", e => { const s = e.target.closest(".slot[data-item]"); if (s) showTip(s); });
grid.addEventListener("focusout", hideTip);
document.getElementById("foot").textContent = `Generated ${DATA.generated} from the buddy-white gear lists; ${Object.keys(DATA.items).length} items.`;
render();
// }}}
</script>
</body>
</html>
